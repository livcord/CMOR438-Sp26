[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpackage"
version = "0.1.0"
description = "ML algorithms – CMOR 438 Final Project"
authors = [{ name = "Livia Cordeiro", email = "lc106@rice.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "seaborn", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlpackage*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]